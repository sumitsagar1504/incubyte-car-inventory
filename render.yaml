services:
  - type: web
    name: incubyte-inventory-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build -w @inventory/api
    startCommand: npm run db:deploy -w @inventory/api && npm run start -w @inventory/api
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: FRONTEND_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
